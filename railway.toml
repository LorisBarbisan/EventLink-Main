[build]
builder = "nixpacks"
# Nixpacks already runs `npm ci` (exactly package-lock.json, the tree CI
# tests) in its install phase. Don't install again here: a second `npm ci`
# tries to delete the mounted node_modules/.cache and fails with EBUSY.
buildCommand = "npm run build"

[deploy]
startCommand = "npm run start"
healthcheckPath = "/health"
healthcheckTimeout = 30
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3

[environments.production]
# Deployed from: main branch
# Domain: your production domain (set in Railway dashboard)

[environments.staging]
# Deployed from: Card branch (or whichever feature branch you're testing)
# Domain: auto-assigned *.up.railway.app URL
