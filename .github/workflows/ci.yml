name: CI

on:
  push:
    branches: [Staging, main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Type check: must be zero errors (no baseline — every error is a real one)
      - run: npm run check
      - run: npm test
      - run: npm run help:check
      # Accessibility (WCAG Level A mechanics). Rules stay at "warn" so the
      # pre-commit hook never blocks; here any warning fails the build.
      - run: npm run lint:a11y
      # Fail on any production dependency with a known critical vulnerability.
      # Raise to --audit-level=high once zod 4 lands (zod + zod-validation-error
      # are the remaining highs; that upgrade is its own change).
      - run: npm audit --omit=dev --audit-level=critical
