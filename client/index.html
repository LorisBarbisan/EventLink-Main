<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- E8 Orange Logo Favicons -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <!-- Modern browsers will prefer PNG, fallback to ICO for older browsers -->
    <title>EventLink | The Home of Freelance Event Professionals</title>

    <!-- Open Graph / Social Media Meta Tags -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://eventlink.one/" />
    <meta property="og:title" content="EventLink | The Home of Freelance Event Professionals" />
    <meta
      property="og:description"
      content="Find opportunities, connect directly with clients, manage your bookings and build your professional reputation — everything freelance event professionals need, in one place."
    />
    <meta property="og:image" content="https://eventlink.one/og-image.png" />
    <meta property="og:image:width" content="1024" />
    <meta property="og:image:height" content="1024" />
    <meta property="og:image:type" content="image/png" />

    <!-- Twitter Card Meta Tags -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="EventLink | The Home of Freelance Event Professionals" />
    <meta
      name="twitter:description"
      content="Find opportunities, connect directly with clients, manage your bookings and build your professional reputation — everything freelance event professionals need, in one place."
    />
    <meta name="twitter:image" content="https://eventlink.one/og-image.png" />

    <!-- General Meta Description -->
    <meta
      name="description"
      content="Find opportunities, connect directly with clients, manage your bookings and build your professional reputation — everything freelance event professionals need, in one place."
    />

    <!-- Search Engine Indexing -->
    <meta name="robots" content="index, follow" />
    <meta name="googlebot" content="index, follow" />

    <!-- LinkedIn Insight Tag and Google Analytics load after cookie consent —
         see client/src/lib/cookieConsent.ts -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
